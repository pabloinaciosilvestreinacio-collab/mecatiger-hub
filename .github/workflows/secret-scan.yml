name: Prevent accidental secret publication

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan-public-source:
    name: Inspect tracked files for known secret formats
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Scan tracked files without revealing values
        run: python3 scripts/scan_public_secrets.py
