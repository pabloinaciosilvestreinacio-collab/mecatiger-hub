# Meca Sim private API: JWT validation at the Supabase Edge gateway.
# Backend also invokes auth.getUser() and database RLS restricts ownership.
# No functions have been deployed or activated in production by this file.
# Homologation is local/disposable only. This file does not link to a hosted project.
project_id = "mecatiger-homologation"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326
admin_email = "homologacao@mecatiger.invalid"
sender_name = "Meca Tiger Homologação"

[auth]
enabled = true
site_url = "http://127.0.0.1:8000"
additional_redirect_urls = [
  "http://127.0.0.1:8000/entrar.html",
  "http://127.0.0.1:8000/entrar.html?next=rede.html",
  "http://127.0.0.1:8000/entrar.html?next=mecasim-demo.html",
  "http://127.0.0.1:8000/entrar.html?next=mecasim.html",
  "http://127.0.0.1:8000/entrar.html?next=admin.html",
  "http://localhost:8000/entrar.html",
  "http://localhost:8000/entrar.html?next=rede.html",
  "http://localhost:8000/entrar.html?next=mecasim-demo.html",
  "http://localhost:8000/entrar.html?next=mecasim.html",
  "http://localhost:8000/entrar.html?next=admin.html"
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 0
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false

[auth.rate_limit]
email_sent = 20
sign_in_sign_ups = 30
token_verifications = 30
token_refresh = 30
anonymous_users = 1

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1s"
otp_length = 6
otp_expiry = 600

[auth.email.template.confirmation]
subject = "Confirme seu acesso de homologação à Meca Tiger"
content_path = "./supabase/templates/local-access.html"

[auth.email.template.magic_link]
subject = "Código de acesso de homologação à Meca Tiger"
content_path = "./supabase/templates/local-access.html"

[functions.mecasim-trajectories]
verify_jwt = true
